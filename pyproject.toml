[project]
name = "cashagentdemo"
version = "0.1.0"
description = "AI-powered Treasury Cash Agent demo for Google Cloud"
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-adk>=1.36.2,<2",
    "google-cloud-aiplatform[adk,agent_engines]",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "requests",
    "flask",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "google-cloud-modelarmor",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.agents-cli]
agent_directory = "agent"
region = "us-central1"

[tool.agents-cli.create_params]
deployment_target = "agent_runtime"
