[project]
name = "cashagentdemo"
version = "0.1.0"
description = "AI-powered Treasury Cash Agent demo for Google Cloud"
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-adk",
    "google-cloud-aiplatform[adk,agent_engines]",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "requests",
    "flask",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
